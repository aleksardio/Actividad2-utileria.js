<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="contenedor">
        <h2>Formulario de Registro</h2>
        <form id="formularioRegistro">
            
            <div class="campo">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" required placeholder="Ej. Victor Salazar">
                <span class="error" id="errorNombre"></span>
            </div>

            <div class="campo">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" required placeholder="ejemplo@correo.com">
                <span class="error" id="errorCorreo"></span>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono (10 dígitos):</label>
                <input type="number" id="telefono" required placeholder="Ej. 9516441805">
                <span class="error" id="errorTelefono"></span>
            </div>

            <div class="campo">
                <label for="fechaNac">Fecha de Nacimiento:</label>
                <input type="date" id="fechaNac" required>
                <span class="error" id="errorFecha"></span>
            </div>

            <div class="campo">
                <label for="curp">CURP:</label>
                <input type="text" id="curp" required placeholder="18 caracteres" maxlength="18">
                <span class="error" id="errorCurp"></span>
            </div>

            <div class="campo">
                <label for="sueldo">Sueldo:</label>
                <input type="number" id="sueldo" required placeholder="Ej. 14999">
            </div>

            <div class="campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="Mín. 8 caracteres, 1 Mayúscula, 1 Número, 1 Especial">
                <span class="error" id="errorPassword"></span>
            </div>

            <button type="submit">Registrarse</button>
        </form>
    </div>

    <dialog id="modalResultado">
        <h3>¡Registro Exitoso!</h3>
        <p id="mensajeModal"></p>
        <button id="btnCerrarModal">Cerrar</button>
    </dialog>

    <script src="js/utileria.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
