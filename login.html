<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="contenedor">
        <h2>Iniciar Sesión</h2>
        <form id="formularioLogin">
            
            <div class="campo">
                <label for="loginCorreo">Correo Electrónico:</label>
                <input type="email" id="loginCorreo" required placeholder="ejemplo@correo.com">
                <span class="error" id="errorLoginCorreo"></span>
            </div>

            <div class="campo">
                <label for="loginPassword">Contraseña:</label>
                <input type="password" id="loginPassword" required>
                <span class="error" id="errorLoginPassword"></span>
            </div>

            <button type="submit">Entrar</button>

            <div style="text-align: center; margin-top: 15px;">
                <a href="index.html" style="color: #007bff; text-decoration: none; font-size: 0.9rem;">¿No tienes cuenta? Regístrate aquí</a>
            </div>
        </form>
    </div>

    <script src="js/utileria.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
